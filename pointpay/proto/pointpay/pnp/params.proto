syntax = "proto3";
package pointpay.pnp;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/pointpay/pointpay/x/pnp/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "pointpay/x/pnp/Params";
  option (gogoproto.equal) = true;

  
  uint64 maxSupply = 1 [(gogoproto.moretags) = "yaml:\"max_supply\""];
}