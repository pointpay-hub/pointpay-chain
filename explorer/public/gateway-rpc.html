<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PointPay RPC — Testnet</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0e11; --panel:#1e2329; --line:#2b3139; --text:#eaecef; --muted:#848e9c; --gold:#f0b90b; --blue:#0784c3; --green:#0ecb81; }
    *{box-sizing:border-box} body{margin:0;font-family:DM Sans,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:1.5rem}
    .card{width:min(520px,100%);background:linear-gradient(180deg,#1e2329,#0b0e11);border:1px solid var(--line);border-radius:14px;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .mark{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:700 11px/1 DM Sans;color:var(--gold);border:1px solid rgba(240,185,11,.4);background:linear-gradient(135deg,rgba(240,185,11,.35),rgba(252,213,53,.08));margin-bottom:1rem}
    h1{margin:0 0 .35rem;font-size:1.35rem} p{margin:0 0 1rem;color:var(--muted);font-size:14px;line-height:1.5}
    .row{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-top:1px solid var(--line);font-size:13px}
    .k{color:var(--muted)} .v{font-family:IBM Plex Mono,monospace;color:var(--green)}
    .actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.15rem}
    a.btn{display:inline-block;padding:.7rem 1rem;border-radius:10px;font-weight:600;font-size:13px;text-decoration:none}
    a.primary{background:var(--gold);color:#0b0e11} a.ghost{background:#2b3139;color:var(--text)}
    code{color:var(--gold);font-family:IBM Plex Mono,monospace;font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">RPC</div>
    <h1>PointPay Chain RPC</h1>
    <p>Tendermint JSON-RPC endpoint for dedicated testnet <code>pointpay-dedicated-1</code>. For a Binance-style explorer UI, open PNPScan.</p>
    <div class="row"><span class="k">Network</span><span class="v" id="net">…</span></div>
    <div class="row"><span class="k">Height</span><span class="v" id="h">…</span></div>
    <div class="row"><span class="k">Synced</span><span class="v" id="s">…</span></div>
    <div class="actions">
      <a class="btn primary" href="https://testnet-explorer.pointpay.exchange/">Open PNPScan</a>
      <a class="btn ghost" href="/status">Raw /status</a>
    </div>
  </div>
  <script>
    fetch('/status').then(r=>r.json()).then(j=>{
      const si=j.result.sync_info, ni=j.result.node_info;
      net.textContent=ni.network;
      h.textContent=si.latest_block_height;
      s.textContent=si.catching_up?'syncing':'yes';
    }).catch(()=>{net.textContent='offline'});
  </script>
</body>
</html>
